[buildout]
extends =
  buildout.hash.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/c2d19e38797dcbb4846dd58f841e9e40a59f28b0/stack/slapos.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/c2d19e38797dcbb4846dd58f841e9e40a59f28b0/stack/monitor/buildout.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/c2d19e38797dcbb4846dd58f841e9e40a59f28b0/component/golang/buildout.cfg

parts =
  slapos-cookbook
  instance-profile
  gowork

[golang-common]
# Build Go without running its test suite. Some runtime tests time out on
# small virtual machines. golang14 sets its own make-targets.
make-targets =
  cd src &&
  unset GOBIN &&
  ./make.bash &&
  GOCACHE=`pwd`/../pkg/obj/go-build ../bin/go clean -cache &&
  ../bin/go clean -cache &&
  cp -alf .. ${:location}

[gowork]
golang = ${golang1.26:location}
install =
  ${go_github.com_influxdata_telegraf:location}:./cmd/telegraf
# opcua and mqtt plugins are pure Go.
# Go writes temporary files and the linked binary under TMPDIR. The system
# /tmp can be a small tmpfs, too small for a Telegraf with all plugins.
environment =
  CGO_ENABLED=0
  TMPDIR=${gowork.dir:tmp}
telegraf-bin = ${:bin}/telegraf

[gowork.dir]
tmp = ${buildout:directory}/tmp
command = mkdir -p ${:directory} ${:tmp}
update-command = ${:command}

[go_github.com_influxdata_telegraf]
<= go-git-package
go.importpath = github.com/influxdata/telegraf
repository = https://github.com/influxdata/telegraf
revision = v1.39.3-0-geb37a442f

[download-file-base]
recipe = slapos.recipe.build:download
url = ${:_profile_base_location_}/${:filename}

[telegraf-config-template]
<= download-file-base

[instance-profile]
recipe = slapos.recipe.template:jinja2
url = ${:_profile_base_location_}/${:filename}
output = ${buildout:directory}/instance.cfg
extensions = jinja2.ext.do
context =
  section buildout buildout
  key telegraf_config_template telegraf-config-template:target
  key telegraf_bin gowork:telegraf-bin
  raw template_monitor ${monitor2-template:output}
